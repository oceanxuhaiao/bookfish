<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>BookFish 浏览器桥接</title>
  <style>
    :root { color-scheme: light dark; }
    body { font: 13px/1.5 system-ui, "Segoe UI", sans-serif; margin: 0; padding: 14px; width: 300px; }
    h1 { font-size: 14px; margin: 0 0 10px; }
    label { display: block; margin: 8px 0 4px; font-weight: 600; }
    input { width: 100%; box-sizing: border-box; padding: 6px 8px; font: inherit; }
    button { margin-top: 10px; width: 100%; padding: 7px; font: inherit; cursor: pointer; }
    #status { margin-top: 10px; padding: 8px; border-radius: 6px; background: rgba(127,127,127,.12); }
    .ok { color: #0a7a3d; }
    .bad { color: #b3261e; }
    p.hint { margin: 10px 0 0; opacity: .75; }
  </style>
</head>
<body>
  <h1>BookFish 浏览器桥接</h1>
  <label for="port">本机端口</label>
  <input id="port" type="number" min="1024" max="65535" placeholder="47823">
  <label for="token">配对令牌</label>
  <input id="token" type="password" spellcheck="false" placeholder="从 BookFish 设置面板复制">
  <button id="save">保存并连接</button>
  <div id="status">未连接</div>
  <p class="hint">令牌只保存在本扩展里。桥接服务只监听 127.0.0.1，网页无法调用；本扩展只在你自己的浏览器里打开页面和下载文件，不会接管或关闭你的标签页。</p>
  <script src="popup.js"></script>
</body>
</html>
